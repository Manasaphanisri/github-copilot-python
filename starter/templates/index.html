<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <div class="page-shell">
    <div class="top-bar">
      <div class="brand-block">
        <p class="eyebrow">Daily challenge</p>
        <h1>Sudoku Game</h1>
      </div>

      <label class="theme-toggle" for="theme-toggle" aria-label="Toggle dark mode">
        <input id="theme-toggle" type="checkbox" aria-pressed="false">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb">
            <span class="theme-toggle-icon" aria-hidden="true">
              <span class="theme-icon moon">🌙</span>
              <span class="theme-icon sun">☀️</span>
            </span>
          </span>
        </span>
      </label>
    </div>

    <div class="game-card">
      <div class="game-layout">
        <div class="left-controls">
          <label class="difficulty-picker" for="difficulty-select">
            <span>Difficulty</span>
            <select id="difficulty-select">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>

          <button id="new-game" type="button">New Game</button>
        </div>

        <div class="board-stage">
          <div id="sudoku-board"></div>
        </div>

        <div class="right-controls">
          <button id="check-solution" type="button">Check Solution</button>
          <button id="use-hint" type="button">Hint</button>
        </div>
      </div>

      <div class="controls">
        <button id="view-leaderboard" type="button">View Leaderboard</button>
        <div class="status-pill">
          <span class="status-label">Timer</span>
          <span id="timer">00:00</span>
        </div>
        <div class="status-pill">
          <span class="status-label">Hints</span>
          <span id="hint-count">Hints: 0</span>
        </div>
        <div id="message" class="status-message"></div>
      </div>

      <div id="leaderboard-container" class="leaderboard-hidden modal-overlay" aria-hidden="true">
        <div class="leaderboard-card" role="region" aria-labelledby="leaderboard-title">
          <div class="leaderboard-header">
            <h2 id="leaderboard-title">Top 10 Leaderboard</h2>
            <button id="close-leaderboard" class="small" type="button">Close</button>
          </div>

          <table id="leaderboard-table" class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Time</th>
                <th>Difficulty</th>
                <th>Hints Used</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="score-entry-container" class="leaderboard-hidden modal-overlay" aria-hidden="true">
    <div class="leaderboard-card score-entry-panel" role="dialog" aria-modal="true" aria-labelledby="score-entry-title">
      <div class="leaderboard-header">
        <h2 id="score-entry-title">Save your score</h2>
        <button id="close-score-entry" class="small" type="button">Close</button>
      </div>

      <form id="score-entry-form" class="score-entry-form">
        <label for="player-name">Name</label>
        <input id="player-name" name="playerName" type="text" maxlength="32" required>
        <button type="submit">Save Score</button>
      </form>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
